# ============================================================
# Staged CI workflow.
# To activate: move this file to .github/workflows/test.yml
# (or ask your Arena agent to do it — the app needs one-time
# "workflows" permission in GitHub Settings -> Apps).
# After that, tests run automatically on every push/PR to main.
# ============================================================
name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run app tests
        run: npm test
