# Chooser settings for the issue templates in this folder.
# Docs: https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/configuring-issue-templates-for-your-repository

# The three templates (bug / feature / question) cover every reason to open an
# issue here, so the blank form is turned off to keep reports consistent.
blank_issues_enabled: false

